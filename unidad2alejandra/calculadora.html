<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .calculadora {
            background-color: rosybrown;
            width: 200px;
            height: 240px;
            border-radius: 10px;
            margin: 10px;
        }
        .numeros {
            color: black;
            background-color: beige;
            width: 200px;
            height: 50px;
            
        }
        .botones {

        }
        .fila1 {

        }
        .fila2 {

        }
        .fila3 {

        }
        .fila4 {

        }
    </style>
</head>
<body>
    <main>
        <section class="calculadora">
            <div class="numeros" id="pantalla">
                <input type="number" id="entrada">
            </div>
            <div class="botones" id="teclado">
                <section class="fila1">
                 <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>+</button>
                </section>
                <section class="fila2">
                 <button>4</button>
                <button>5</button>
                <button>6</button>  
                <button>-</button> 
                </section>
                <section class="fila3">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>*</button>    
                </section>
                <section class="fila4">
                <button>0</button>
                <button>.</button>
                <button>/</button>
                <button>=</button>
                </section>
            </div>
        </section>
    </main>
</body>
</html>
